description: 'Manus Bio Inc. (trading as "Manus", the BioAlternatives Company) is a Cambridge,
  Massachusetts industrial biotechnology company founded in 2011 out of MIT by Dr. Aji Parayil
  and Dr. Greg Stephanopoulos. Manus engineers microbial cell factories and precision-fermentation
  processes so that complex molecules normally obtained through petrochemical synthesis, agricultural
  extraction, or animal husbandry can be produced by fermentation instead - what the company calls
  bioalternatives. Its commercialized products include the first U.S. commercial-scale monk fruit
  sweetener (produced at its Augusta, Georgia BioFacility), the Yume M stevia Reb M sweetener
  co-developed with Tate & Lyle, citrus-derived aroma ingredients (Nootkatone 70, Valencene 80,
  BioNootkatone) for Givaudan, and an artemisinin antimalarial program funded by HHS/ASPR. It sells
  scale-up services through its BioAccelerator and BioManufacturing programs (protein engineering,
  strain development, bioprocess development from 250 ml to 3,000 L, pilot-scale and biomanufacturing).
  In April 2025 Manus merged with genome-engineering company Inscripta, adding whole-genome editing
  technology and the MAD7 CRISPR nuclease licensing program; inscripta.com is now a redirect notice.
  Manus is a manufacturer of physical ingredients and a contract development and manufacturing
  organization - it sells molecules and services, not software. It publishes no public API, developer
  portal, SDK, webhook surface, or machine-readable specification of any kind, and its computational
  and AI-driven enzyme-engineering tools are internal capabilities that support its services rather
  than a customer-facing platform.'
